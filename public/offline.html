      --border-strong: rgba(15, 23, 42, 0.12);
      --text-main: #0b0b10;
      --text-muted: #64748b;
      --primary: #6c0cf0;
      --primary-hover: #5708c9;
      --primary-rgb: 108, 12, 240;
      --accent: #00f0ff;
      --online: #10b981;
      --offline-amber: #f59e0b;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color-scheme: light;
    }

    html.dark {
      --bg: #000000;
      --surface: #0a0b0e;
      --surface-card: #0a0b0e;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --primary-rgb: 124, 58, 237;
      color-scheme: dark;
    }

    html.dark body {
      background-color: #000000;
      color: #f3f4f6;
    }

    html.dark .offline-card {
      background-color: #0a0b0e;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    html.dark .icon-wrapper {
      background-color: #12151e;
      border-color: rgba(255, 255, 255, 0.12);
    }

    html.dark .btn-home {
      border-color: rgba(255, 255, 255, 0.12);
      color: #f3f4f6;
    }

    html.dark .btn-home:hover {
      background-color: #141722;
      border-color: rgba(255, 255, 255, 0.2);
    }

    html.dark .theme-toggle-btn {
      background-color: #0a0b0e;
      border-color: rgba(255, 255, 255, 0.12);
      color: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background-color: var(--primary);
      color: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4.5rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .top-header.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.05);
      border-color: var(--border-strong);
    }

    .theme-toggle-btn:active {
      transform: scale(0.95);
    }

    /* Estágio do Logo: Inicia centralizado na tela */
    .logo-stage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(82vw, 520px);
      z-index: 40;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform, top, width;
    }

    .prx-logo-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      color: var(--text-main);
      filter: drop-shadow(0 0 24px rgba(var(--primary-rgb), 0.22));
      transition: color 0.3s ease;
    }

    /* Ocultação rigorosa a nível de container no frame zero */
    #wordmark-group,
    #tagline-group,
    #bar-group {
      opacity: 0;
      visibility: hidden;
    }

    [data-piece="white"],
    [data-piece="color"],
    [data-piece="x-arm"] {
      opacity: 0;
      visibility: hidden;
    }

    [data-letter] {
      transform: translateY(130px);
    }

    #tag-clip-rect {
      width: 0;
    }

    [data-bar] {
      transform: scaleX(0);
      transform-origin: 50% 50%;
    }

    .page-viewport {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6.5rem 1.5rem 2.5rem;
      position: relative;
      z-index: 10;
    }

    .logo-placeholder {
      width: min(76vw, 400px);
      height: 5.5rem;
      margin-bottom: 1.5rem;
      visibility: hidden;
    }

    .offline-card {
      width: 100%;
      max-width: 480px;
      background-color: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem 1.75rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
      text-align: center;
      opacity: 0;
      transform: translateY(35px);
      pointer-events: none;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .offline-card.visible {
      pointer-events: auto;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      color: var(--offline-amber);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      transition: all 0.3s ease;
    }

    .status-badge.online-restored {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--online);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--offline-amber);
      box-shadow: 0 0 8px var(--offline-amber);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-badge.online-restored .status-dot {
      background-color: var(--online);
      box-shadow: 0 0 8px var(--online);
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    h1 {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 1.875rem;
      }
    }

    p.description {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
      }
    }

    button.btn-retry {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      min-height: 48px;
      background-color: var(--primary);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    button.btn-retry:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 20px rgba(var(--primary-rgb), 0.45);
      transform: translateY(-1px);
    }

    button.btn-retry:active {
      transform: translateY(1px);
    }

    button.btn-retry.loading {
      opacity: 0.85;
      pointer-events: none;
    }

    button.btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.25rem;
      min-height: 48px;
      background-color: transparent;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    button.btn-home:hover {
      background-color: var(--surface);
      border-color: var(--border-strong);
    }

    .network-indicator {
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .pulse-ring {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
      opacity: 0.7;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .spinning {
      animation: spin 0.85s linear infinite;
    }

    @supports (padding: env(safe-area-inset-top)) {
      .top-header {
        top: env(safe-area-inset-top);
      }
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }
  </style>
</head>

  <script>
    // 1. Gerenciamento do Tema Claro / Escuro sincronizado
    (function setupThemeSystem() {
      var btn = document.getElementById('theme-toggle');
      var iconSun = document.getElementById('icon-sun');
      var iconMoon = document.getElementById('icon-moon');

      function getSavedTheme() {
        try {
          var appTheme = localStorage.getItem('prx-app-theme');
          var landingTheme = localStorage.getItem('prx-theme');
          var theme = appTheme || landingTheme;
          if (theme === 'dark' || theme === 'light') return theme;
        } catch (e) {}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }

      function applyTheme(newTheme) {
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(newTheme);
        root.setAttribute('data-theme', newTheme);
        root.style.colorScheme = newTheme;

        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', newTheme === 'dark' ? '#000000' : '#ffffff');

        if (newTheme === 'dark') {
          if (iconSun) iconSun.style.display = 'block';
          if (iconMoon) iconMoon.style.display = 'none';
          if (btn) {
            btn.setAttribute('title', 'Mudar para Modo Claro');
            btn.setAttribute('aria-label', 'Alternar para modo claro');
          }
        } else {
          if (iconSun) iconSun.style.display = 'none';
          if (iconMoon) iconMoon.style.display = 'block';
          if (btn) {
            btn.setAttribute('title', 'Mudar para Modo Escuro');
            btn.setAttribute('aria-label', 'Alternar para modo escuro');
          }
        }

        try {
          localStorage.setItem('prx-theme', newTheme);
          localStorage.setItem('prx-app-theme', newTheme);
        } catch (e) {}
      }

      var currentTheme = getSavedTheme();
      applyTheme(currentTheme);

      if (btn) {
        btn.addEventListener('click', function() {
          var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
          applyTheme(next);
        });
      }
    })();

    // 2. Animação Oficial GSAP 100% idêntica ao PrxLoader online
    (function runOfficialAnimation() {
      var logoStage = document.getElementById('logo-stage');
      var logoSvg = document.getElementById('prx-logo');
      var panel = document.getElementById('offline-panel');
      var header = document.getElementById('top-header');

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function transitionLogoToTop() {
        if (!logoStage) return;

        var targetTop = '4.5rem';
        var targetWidth = Math.min(window.innerWidth * 0.76, 400);

        if (window.gsap && !reduceMotion) {
          var transTl = gsap.timeline();
          
          transTl.to(logoStage, {
            top: targetTop,
            yPercent: 0,
            y: 0,
            transform: 'translate(-50%, 0)',
            width: targetWidth,
            duration: 0.95,
            ease: "power3.inOut"
          })
          .fromTo(panel, 
            { autoAlpha: 0, y: 35 }, 
            { autoAlpha: 1, y: 0, duration: 0.75, ease: "power3.out" }, 
            "-=0.4"
          )
          .to(header, {
            autoAlpha: 1,
            duration: 0.45,
            ease: "power2.out",
            onComplete: function() {
              if (panel) panel.classList.add('visible');
              if (header) header.classList.add('visible');
            }
          }, "-=0.5");
        } else {
          if (panel) {
            panel.style.opacity = '1';
            panel.style.transform = 'translateY(0)';
            panel.classList.add('visible');
          }
          if (header) {
            header.style.opacity = '1';
            header.classList.add('visible');
          }
          if (logoStage) {
            logoStage.style.top = targetTop;
            logoStage.style.transform = 'translate(-50%, 0)';
            logoStage.style.width = targetWidth + 'px';
          }
        }
      }

      if (reduceMotion) {
        var tagClip = document.getElementById('tag-clip-rect');
        if (tagClip) tagClip.setAttribute('width', '776.5');
        if (window.gsap) {
          gsap.set("#symbol-group", { x: 0 });
          gsap.set("#wordmark-group, #tagline-group, #bar-group", { autoAlpha: 1 });
          gsap.set("[data-piece='white'], [data-piece='color'], [data-piece='x-arm']", { autoAlpha: 1, x: 0, y: 0 });
          gsap.set("[data-letter]", { y: 0 });
          gsap.set("[data-bar]", { scaleX: 1 });
        }
        transitionLogoToTop();
        return;
      }

      if (window.gsap) {
        var SYMBOL_CENTER_OFFSET = 263; // 776.5 / 2 - 250.5 / 2

        // PREPARAÇÃO CRÍTICA DE ESTADOS INICIAIS NO FRAME 0
        // Apenas o ícone está presente e centralizado. PRX, subtítulo e barra estão 100% invisíveis.
        gsap.set("#symbol-group", { x: SYMBOL_CENTER_OFFSET });
        gsap.set("#piece-white", { x: -90, y: -20, autoAlpha: 0 });
        gsap.set("#piece-color", { x: 90, y: 20, autoAlpha: 0 });
        gsap.set("#wordmark-group", { autoAlpha: 0 });
        gsap.set("[data-letter]", { y: 130 });
        gsap.set("#piece-x-arm", { x: 46, y: -46, autoAlpha: 0 });
        gsap.set("#tagline-group", { autoAlpha: 0 });
        gsap.set("#tag-clip-rect", { attr: { width: 0 } });
        gsap.set("#bar-group", { autoAlpha: 0 });
        gsap.set("#word-bar", { scaleX: 0, transformOrigin: "50% 50%" });

        // Revela o SVG já nos estados iniciais
        gsap.set(logoSvg, { autoAlpha: 1 });

        var tl = gsap.timeline({
          defaults: { ease: "expo.out" },
          onComplete: function() {
            setTimeout(transitionLogoToTop, 200);
          }
        });

        // 1. FASE 1: Somente o ícone (peças branca e colorida) deslizam e se encontram no centro
        tl.to("#piece-white", { x: 0, y: 0, autoAlpha: 1, duration: 0.85 }, 0.1)
          .to("#piece-color", { x: 0, y: 0, autoAlpha: 1, duration: 0.85 }, 0.18)
        
        // 2. FASE 2: O ícone desliza para a esquerda e o PRX aparece (letras sobem da máscara e braço do X encaixa)
          .to("#symbol-group", { x: 0, duration: 0.85, ease: "expo.inOut" }, 0.8)
          .set("#wordmark-group", { autoAlpha: 1 }, 0.8)
          .to("[data-letter]", { y: 0, duration: 0.9, stagger: 0.09, ease: "expo.out" }, 1.38)
          .to("#piece-x-arm", { x: 0, y: 0, autoAlpha: 1, duration: 0.7, ease: "back.out(2)" }, 1.78)

        // 3. FASE 3: A barra e o subtítulo aparecem
          .set("#tagline-group", { autoAlpha: 1 }, 2.0)
          .to("#tag-clip-rect", { attr: { width: 776.5 }, duration: 0.9, ease: "power3.inOut" }, 2.0)
          .set("#bar-group", { autoAlpha: 1 }, 2.35)
          .to("#word-bar", { scaleX: 1, duration: 0.7, ease: "power3.out" }, 2.35)
          .to({}, { duration: 0.35 });

      } else {
        var clip = document.getElementById('tag-clip-rect');
        if (clip) clip.setAttribute('width', '776.5');
        transitionLogoToTop();
      }
    })();

    // 3. Lógica de Reconexão e Botão "Tentar Novamente"
    (function setupReconnection() {
      var btnRetry = document.getElementById('btn-retry');
      var btnHome = document.getElementById('btn-home');
      var retryIcon = document.getElementById('retry-icon');
      var retryLabel = document.getElementById('retry-label');
      var badgeStatus = document.getElementById('badge-status');
      var badgeText = document.getElementById('badge-text');
      var indicatorText = document.getElementById('indicator-text');
      var isRetrying = false;

      function attemptReload(manual) {
        if (isRetrying) return;
        isRetrying = true;

        if (btnRetry) btnRetry.classList.add('loading');
        if (retryIcon) retryIcon.classList.add('spinning');
        if (retryLabel) retryLabel.textContent = 'Verificando conexão...';
        if (indicatorText) indicatorText.textContent = 'Testando resposta da rede...';

        var pingUrl = '/manifest.json?_t=' + Date.now();

        fetch(pingUrl, { method: 'HEAD', cache: 'no-store' })
          .then(function(res) {
            if (res.ok || res.status < 500) {
              if (badgeStatus) badgeStatus.classList.add('online-restored');
              if (badgeText) badgeText.textContent = 'Conectado!';
              if (retryLabel) retryLabel.textContent = 'Conectado! Recarregando...';
              if (indicatorText) indicatorText.textContent = 'Sinal restabelecido! Recarregando página...';

              setTimeout(function() {
                window.location.reload();
              }, 400);
            } else {
              throw new Error('Offline');
            }
          })
          .catch(function() {
            isRetrying = false;
            if (btnRetry) btnRetry.classList.remove('loading');
            if (retryIcon) retryIcon.classList.remove('spinning');
            if (retryLabel) retryLabel.textContent = 'Tentar novamente';
            if (badgeStatus) badgeStatus.classList.remove('online-restored');
            if (badgeText) badgeText.textContent = 'Ainda Sem Conexão';
            if (indicatorText) {
              indicatorText.textContent = manual
                ? 'Sem conexão no momento. Tente novamente em instantes.'
                : 'Aguardando sinal para reconectar automaticamente...';
            }
          });
      }

      if (btnRetry) {
        btnRetry.addEventListener('click', function() {
          attemptReload(true);
        });
      }

      if (btnHome) {
        btnHome.addEventListener('click', function() {
          window.location.href = '/';
        });
      }

      window.addEventListener('online', function() {
        attemptReload(false);
      });

      setInterval(function() {
        if (navigator.onLine && !isRetrying) {
          attemptReload(false);
        }
      }, 3500);
    })();
  </script>
</body>
